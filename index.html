
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Momo ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffe0eb, #f8c6dc, #e9d5ff);
  color: #71364f;
}

.card {
  width: min(90%, 440px);
  padding: 38px 25px;
  text-align: center;
  background: rgba(255,255,255,.8);
  border: 1px solid white;
  border-radius: 28px;
  box-shadow: 0 15px 50px #a94e7650;
  position: relative;
  z-index: 2;
}

.heart {
  font-size: 65px;
  animation: heartbeat 1.2s infinite;
}

h1 { font-size: 36px; margin: 12px 0; }
p { font-size: 18px; line-height: 1.6; }

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 28px;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 14px 30px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  transition: .2s;
}

button:hover { transform: scale(1.08); }

#yes {
  color: white;
  background: #e84c86;
  box-shadow: 0 5px 15px #e84c8660;
}

#no {
  color: #71364f;
  background: #f8dce8;
}

#result {
  display: none;
  margin-top: 25px;
  font-size: 23px;
  line-height: 1.5;
  animation: appear .6s ease;
}

.small {
  font-size: 13px;
  opacity: .7;
  margin-top: 25px;
}

.floating {
  position: fixed;
  bottom: -30px;
  font-size: 22px;
  animation: floatUp 6s linear forwards;
  pointer-events: none;
  z-index: 1;
}

@keyframes heartbeat {
  50% { transform: scale(1.15); }
}

@keyframes floatUp {
  to { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="card">
  <div class="heart">💗</div>
  <h1>For Momo</h1>

  <p>
    There's something I've been wanting to tell you...
  </p>

  <h2>I Love You, Momo ❤️</h2>

  <p>
    Will you accept my proposal and make me the happiest person?
  </p>

  <div class="buttons" id="buttons">
    <button id="yes" onclick="answerYes()">YES 💖</button>
    <button id="no" onclick="answerNo()">NO 🙈</button>
  </div>

  <div id="result"></div>

  <div class="small">Made with love, just for Momo ♡</div>
</div>

<script>
function answerYes() {
  document.getElementById("buttons").style.display = "none";
  document.getElementById("result").innerHTML =
    "YAYYYYY!!! THANK YOUUUUU MOMO!!! 💖🥹<br><br>You just made my day! ❤️";
  document.getElementById("result").style.display = "block";
  celebration();
}

function answerNo() {
  document.getElementById("buttons").style.display = "none";
  document.getElementById("result").innerHTML =
    "It's okieee Momo ❤️<br><br>We are still friends. Nothing changes! 🌷";
  document.getElementById("result").style.display = "block";
}

function celebration() {
  for (let i = 0; i < 35; i++) {
    setTimeout(createHeart, i * 100);
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.textContent = ["💗", "💖", "💕", "❤️", "🌸"][Math.floor(Math.random() * 5)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 3) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
</script>
</body>
</html>
